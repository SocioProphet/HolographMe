name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schemas-and-runtime:
    name: Validate schemas, examples, and projection runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate JSON Schemas and examples
        run: python scripts/validate_schemas.py

      - name: Run runtime tests
        run: python -m unittest discover -s tests

      - name: Exercise projection CLI
        run: |
          python scripts/generate_projection.py \
            --twin examples/human-digital-twin.example.json \
            --consent examples/consent-policy.example.json \
            --mission examples/mission.example.json \
            --out generated/projection.json \
            --receipt-out generated/receipt.json \
            --decision-log-out generated/decision-log.json \
            --now 2026-05-04T18:30:00Z \
            --receipt-id tr_projection_001 \
            --decision-log-id pdl_projection_001

      - name: Exercise rejected projection CLI decision log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          consent = json.loads(Path('examples/consent-policy.example.json').read_text())
          consent['expires_at'] = '2026-05-01T00:00:00Z'
          Path('generated/expired-consent.json').write_text(json.dumps(consent, indent=2) + '\n')
          PY
          set +e
          python scripts/generate_projection.py \
            --twin examples/human-digital-twin.example.json \
            --consent generated/expired-consent.json \
            --mission examples/mission.example.json \
            --out generated/rejected-projection.json \
            --receipt-out generated/rejected-receipt.json \
            --decision-log-out generated/rejected-decision-log.json \
            --now 2026-05-04T18:30:00Z \
            --decision-log-id pdl_rejected_expired_001
          status=$?
          set -e
          test "$status" -eq 2
          test -f generated/rejected-decision-log.json
          python - <<'PY'
          import json
          from pathlib import Path
          log = json.loads(Path('generated/rejected-decision-log.json').read_text())
          assert log['decisions'][0]['reason'] == 'consent_policy_expired'
          PY

      - name: Exercise capability event CLI
        run: |
          python scripts/capability_event.py \
            --twin examples/human-digital-twin.example.json \
            --event-log examples/capability-claim-event.example.json \
            --event examples/capability-claim-event.append.example.json \
            --out generated/capability-event-log.json \
            --receipt-out generated/capability-receipt.json \
            --twin-out generated/capability-twin.json \
            --receipt-id tr_ccev_claim_expired_001
          python - <<'PY'
          import json
          from pathlib import Path
          log = json.loads(Path('generated/capability-event-log.json').read_text())
          receipt = json.loads(Path('generated/capability-receipt.json').read_text())
          twin = json.loads(Path('generated/capability-twin.json').read_text())
          assert log['events'][-1]['event_id'] == 'ccev_claim_expired_001'
          assert receipt['details']['claim_id'] == 'claim_agentic_systems_001'
          assert receipt['details']['event_id'] == 'ccev_claim_expired_001'
          assert receipt['details']['status_after'] == 'expired'
          assert twin['capability_claims'][0]['verification_status'] == 'expired'
          PY

      - name: Exercise rejected capability event CLI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          event = json.loads(Path('examples/capability-claim-event.append.example.json').read_text())
          event['event_id'] = 'ccev_bad_before_001'
          event['status_before'] = 'self_attested'
          Path('generated/bad-capability-event.json').write_text(json.dumps(event, indent=2) + '\n')
          PY
          set +e
          python scripts/capability_event.py \
            --twin examples/human-digital-twin.example.json \
            --event-log examples/capability-claim-event.example.json \
            --event generated/bad-capability-event.json \
            --out generated/bad-capability-event-log.json \
            --receipt-out generated/bad-capability-receipt.json
          status=$?
          set -e
          test "$status" -eq 2
